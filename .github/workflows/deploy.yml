name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm remote deployment."
        required: true
        type: string

jobs:
  deploy:
    name: Manual SSH deploy
    runs-on: ubuntu-latest
    if: inputs.confirm == 'DEPLOY'
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${DEPLOY_PATH}"
          test -n "${DEPLOY_SSH_KEY}"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Package deployment artifact
        id: package
        run: |
          artifact_path="$(bash scripts/package_deployment.sh)"
          echo "artifact_path=${artifact_path}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy artifact over SSH
        env:
          DEPLOY_HOST: deploy-target
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_ARTIFACT: ${{ steps.package.outputs.artifact_path }}
          RELEASE_ID: ${{ github.sha }}
        run: bash scripts/deploy_via_ssh.sh
