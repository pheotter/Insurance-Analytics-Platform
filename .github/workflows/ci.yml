name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  python-and-dbt-static:
    name: Python tests and dbt static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,workflow]" dbt-snowflake

      - name: Run Python unit and syntax checks
        run: bash scripts/validate.sh python

      - name: Run dbt parse and compile checks
        run: bash scripts/validate.sh dbt-static

  dbt-contract-build:
    name: Optional Snowflake dbt contract build
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/secrets/snowflake_key.pem

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Snowflake secret availability
        id: snowflake-secrets
        run: |
          if [[ -n "${SNOWFLAKE_ACCOUNT}" && -n "${SNOWFLAKE_PRIVATE_KEY}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Snowflake secrets are not configured; skipping warehouse dbt build."
          fi
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Set up Python
        if: steps.snowflake-secrets.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.snowflake-secrets.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,workflow]" dbt-snowflake

      - name: Configure Snowflake private key
        if: steps.snowflake-secrets.outputs.available == 'true'
        run: |
          mkdir -p secrets
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > secrets/snowflake_key.pem
          chmod 600 secrets/snowflake_key.pem

      - name: Build contracted staging models
        if: steps.snowflake-secrets.outputs.available == 'true'
        run: bash scripts/validate.sh dbt-build

  package-deployment-artifact:
    name: Package deployment artifact
    runs-on: ubuntu-latest
    needs:
      - python-and-dbt-static
      - dbt-contract-build
    if: github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package deployment artifact
        id: package
        run: |
          artifact_path="$(bash scripts/package_deployment.sh)"
          echo "artifact_path=${artifact_path}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(basename "${artifact_path}")" >> "$GITHUB_OUTPUT"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          retention-days: 14
