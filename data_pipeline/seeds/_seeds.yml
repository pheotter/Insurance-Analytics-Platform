version: 2

seeds:
  - name: development_pool_mapping

    columns:
      - name: development_pool_id
        data_tests:
          - not_null

      - name: line_of_business
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: coverage_code
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - development_pool_id
              - line_of_business
              - product_id
              - coverage_code
