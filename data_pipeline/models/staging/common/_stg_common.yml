version: 2

models:
  - name: stg_policy
    description: "Standardized policy-term records shared across all lines of business."
    columns:
      - name: policy_id
        description: "Globally unique policy identifier."
        tests: [not_null, unique]
      - name: policy_number
        description: "Business-facing policy number."
      - name: insured_id
        description: "Identifier of the insured party."
      - name: product_id
        description: "Insurance product identifier."
      - name: line_of_business
        description: "Insurance line of business."
      - name: effective_date
        description: "Policy effective date."
      - name: expiration_date
        description: "Policy contractual expiration date."
      - name: cancellation_date
        description: "Early termination date when the policy was cancelled."
      - name: policy_status
        description: "Standardized policy lifecycle status renamed from source status."
      - name: underwriting_tier
        description: "Underwriting risk tier used by pricing logic."
      - name: primary_state
        description: "Primary state associated with the policy."
      - name: term_months
        description: "Policy term length in months."
      - name: source_system
        description: "Operational policy administration source."

  - name: stg_policy_risk_unit
    description: "Standardized insured risk units shared across all lines of business."
    columns:
      - name: risk_unit_id
        description: "Globally unique risk-unit identifier."
        tests: [not_null, unique]
      - name: policy_id
        description: "Parent policy identifier."
        tests: [not_null]
      - name: risk_unit_type
        description: "Type of insured object."
      - name: source_risk_unit_id
        description: "Identifier of the LOB-specific source entity."
      - name: effective_date
        description: "Risk-unit effective date."
      - name: expiration_date
        description: "Risk-unit expiration date."
      - name: policy_risk_unit_status
        description: "Standardized risk-unit status renamed from source status."
      - name: exposure_unit
        description: "Exposure measurement unit for the insured object."
      - name: source_system
        description: "Operational source of the risk unit."

  - name: stg_policy_coverage
    description: "Standardized coverage terms at the policy and risk-unit grain."
    columns:
      - name: coverage_id
        description: "Globally unique coverage-term identifier."
        tests: [not_null, unique]
      - name: policy_id
        description: "Parent policy identifier."
        tests: [not_null]
      - name: risk_unit_id
        description: "Covered risk-unit identifier."
        tests: [not_null]
      - name: coverage_code
        description: "LOB-specific coverage code."
      - name: coverage_family
        description: "Normalized coverage family."
      - name: effective_date
        description: "Coverage effective date."
      - name: expiration_date
        description: "Coverage expiration date."
      - name: limit_amount
        description: "Coverage limit or insured value."
      - name: deductible_amount
        description: "Coverage deductible."
      - name: written_premium
        description: "Written premium for the coverage term."
      - name: source_system
        description: "Operational policy administration source."

  - name: stg_premium_transaction
    description: "Standardized premium transactions including new business, endorsements, and cancellations."
    columns:
      - name: transaction_id
        description: "Globally unique premium transaction identifier."
        tests: [not_null, unique]
      - name: policy_id
        description: "Parent policy identifier."
        tests: [not_null]
      - name: coverage_id
        description: "Coverage affected by the premium transaction."
        tests: [not_null]
      - name: transaction_type
        description: "Premium transaction classification."
      - name: transaction_date
        description: "Date the premium transaction was posted."
      - name: transaction_reason
        description: "Business reason for the transaction."
      - name: premium_change
        description: "Signed premium movement generated by the transaction."
      - name: cumulative_premium
        description: "Cumulative written premium after the transaction."
      - name: source_system
        description: "Operational billing source."

  - name: stg_claim
    description: "Standardized claim header records shared across all lines of business."
    columns:
      - name: claim_id
        description: "Globally unique claim identifier."
        tests: [not_null, unique]
      - name: policy_id
        description: "Policy under which the claim was reported."
        tests: [not_null]
      - name: risk_unit_id
        description: "Insured risk unit associated with the loss."
        tests: [not_null]
      - name: coverage_id
        description: "Coverage responding to the claim."
        tests: [not_null]
      - name: coverage_code
        description: "Coverage code reported on the claim."
      - name: loss_date
        description: "Date the insured loss occurred."
      - name: reported_date
        description: "Date the claim was reported."
      - name: claim_type
        description: "Claim scenario or loss type."
      - name: cause_code
        description: "Cause-of-loss code."
      - name: claim_status
        description: "Standardized claim lifecycle status."
      - name: source_system
        description: "Operational claims administration source."

  - name: stg_claim_transaction
    description: "Standardized claim financial movements used for actuarial development."
    columns:
      - name: transaction_id
        description: "Globally unique claim transaction identifier."
        tests: [not_null, unique]
      - name: claim_id
        description: "Parent claim identifier."
        tests: [not_null]
      - name: transaction_type
        description: "Claim financial transaction classification."
      - name: transaction_date
        description: "Date the claim transaction was posted."
      - name: paid_loss_change
        description: "Change in paid indemnity loss."
      - name: case_reserve_change
        description: "Signed movement in case loss reserve."
      - name: paid_expense_change
        description: "Change in paid loss adjustment expense."
      - name: case_expense_change
        description: "Signed movement in case expense reserve."
      - name: recovery_change
        description: "Change in salvage, subrogation, or other recoveries."
      - name: incurred_loss_change
        description: "Net incurred movement for the transaction."
      - name: source_system
        description: "Operational claim transaction source."
