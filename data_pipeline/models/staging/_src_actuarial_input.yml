version: 2

sources:
  - name: actuarial_input
    description: Actuary needs to determine the ldfs of each development, ultimate losses for different segmentation combinations and give their judgments so it's reproducible
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
    tables:
      - name: ldf_selection_table
        description: ldf selections for incurred loss
        columns:
          - name: segmentation_version
            description: "which segmentation combination we decide to use. See more details in models/config/segmentation_config.sql"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["v1","v2","v3"]

          - name: triangle_type
            description: "for incurred triangle or claim count triangle"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["paid", "incurred", "claim_count"]

          - name: state
            description: "states of the US"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["CA","TX","FL","NY","IL","PA","OH","GA","NC","MI","ALL"]

          - name: risk_class
            description: "risk class of the car"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["preferred", "standard", "nonstandard", "commercial", "ALL"]

          - name: vehicle_segment
            description: "vehicle type"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["sedan", "suv", "truck", "sports", "ALL"]

          - name: development
            description: "developement"
            tests:
              - not_null

          - name: ldf
            description: "ldf you choose for a specific configuration if the method is other, otherwise you don't need to fill in it"

          - name: method
            description: "which method you choose"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["last3_weighted", "avg", "weighted", "other"]

          - name: description
            description: "Description how to choose the ldf"
            tests:
              - not_null

      - name: selected_ultimate
        description: Candidate ultimate losses and claim counts for different methods, accident years and segmentations
        columns:
          - name: segmentation_version
            description: "which segmentation combination we decide to use. See more details in models/config/segmentation_config.sql"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["v1","v2","v3"]

          - name: type
            description: "Ultimate loss or ultimate claim count"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["loss", "claim_count"]

          - name: state
            description: "states of the US"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["CA","TX","FL","NY","IL","PA","OH","GA","NC","MI","ALL"]

          - name: risk_class
            description: "risk class of the car"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["preferred", "standard", "nonstandard", "commercial", "ALL"]

          - name: vehicle_segment
            description: "vehicle type"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["sedan", "suv", "truck", "sports", "ALL"]

          - name: accident_year
            description: "Accident Year"
            tests:
              - not_null

          - name: ultimate
            description: "Ultimate loss or ultimate claim count"
            tests:
              - not_null

          - name: method
            description: "which method you choose"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["BF", "Cape_cod", "Judgement"]

          - name: comment
            description: "Describe how you calculated this ultimate loss or claim count"
            tests:
              - not_null

      - name: ultimate_selection
        description: Final selected ultimate method for each accident year, type and segmentation
        columns:
          - name: segmentation_version
            description: "which segmentation combination we decide to use. See more details in models/config/segmentation_config.sql"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["v1","v2","v3"]

          - name: type
            description: "Ultimate loss or ultimate claim count"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["loss", "claim_count"]

          - name: state
            description: "states of the US"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["CA","TX","FL","NY","IL","PA","OH","GA","NC","MI","ALL"]

          - name: risk_class
            description: "risk class of the car"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["preferred", "standard", "nonstandard", "commercial", "ALL"]

          - name: vehicle_segment
            description: "vehicle type"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["sedan", "suv", "truck", "sports", "ALL"]

          - name: accident_year
            description: "Accident Year"
            tests:
              - not_null

          - name: method
            description: "Selected ultimate method for that AY"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["BF", "Cape_cod", "Judgement", "Chain_ladder", "Chain_ladder_incurred", "Chain_ladder_paid"]

          - name: comment
            description: "Describe why this method was selected"
            tests:
              - not_null

      - name: trend_selection
        description: trend selections for frequency or severity or loss
        columns:
          - name: segmentation_version
            description: "which segmentation combination we decide to use. See more details in models/config/segmentation_config.sql"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["v1","v2","v3"]

          - name: trend_type
            description: "frequency, severity or loss"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["frequency", "severity"]

          - name: state
            description: "states of the US"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["CA","TX","FL","NY","IL","PA","OH","GA","NC","MI","ALL"]

          - name: risk_class
            description: "risk class of the car"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["preferred", "standard", "nonstandard", "commercial", "ALL"]

          - name: vehicle_segment
            description: "vehicle type"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["sedan", "suv", "truck", "sports", "ALL"]

          - name: annual_trend
            description: "trend value"
            tests:
              - not_null

          - name: effective_from
            description: "when the new rate is effective from"

          - name: effective_to
            description: "when the new rate is effective to"
            tests:
              - not_null

          - name: description
            description: "Description how to choose the trend"
            tests:
              - not_null

      - name: expense_assumption
        description: expense assumptions
        columns:
          - name: pricing_version
            description: "Pricing scenario or filing version that these expense assumptions apply to"
            tests:
              - not_null
          - name: state
            description: "states of the US"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["CA","TX","FL","NY","IL","PA","OH","GA","NC","MI","ALL"]

          - name: fixed_expense_per_exposure
            description: "Fiexed expense per exposure"
            tests:
              - not_null

          - name: variable_expense_ratio
            description: "Variable underwriting expense that varies with premium"
            tests:
              - not_null

          - name: ulae_ratio
            description: "Unallocated loss adjustment expense ratio"
            tests:
              - not_null

          - name: profit_ratio
            description: "Target profit ratio"
            tests:
              - not_null
          - name: target_loss_ratio
            description: "Target loss ratio for indication"
            tests:
              - not_null

      - name: assumption_version
        description: Metadata table for uploaded assumption versions and submission context
        columns:
          - name: assumption_set_id
            description: "Unique identifier for one uploaded assumption set"
            tests:
              - not_null

          - name: assumption_type
            description: "Type of assumption workbook uploaded"
            tests:
              - not_null

          - name: version_sequence
            description: "Auto-incrementing numeric version within each assumption type"

          - name: version_label
            description: "User-facing version label for the upload"

          - name: uploaded_at
            description: "Timestamp when this assumption version was registered"

          - name: uploaded_by
            description: "Author associated with this upload"

          - name: upload_comment
            description: "Free-text rationale or note captured during upload"

          - name: dag_run_id
            description: "Airflow DAG run id associated with this upload, when applicable"

      - name: assumption_change_log
        description: Field-level and row-level diff log between the prior and current uploaded assumption versions
        columns:
          - name: assumption_set_id
            description: "Unique identifier linking change rows back to the uploaded assumption version"
            tests:
              - not_null

          - name: assumption_type
            description: "Type of assumption workbook uploaded"
            tests:
              - not_null

          - name: row_key
            description: "Natural-key-based identifier for the changed row"

          - name: change_type
            description: "Whether the row or field was added, removed, or updated"

          - name: column_name
            description: "Changed column name or __row__ for row-level add/remove events"

          - name: old_value
            description: "Prior value before the upload"

          - name: new_value
            description: "Current value after the upload"

          - name: changed_at
            description: "Timestamp when the diff was recorded"

      - name: pipeline_run_metadata
        description: Mapping between pipeline runs and the assumption versions they consumed or registered
        columns:
          - name: pipeline_run_metadata_id
            description: "Unique identifier for the metadata record"
            tests:
              - not_null

          - name: assumption_set_id
            description: "Assumption version linked to this pipeline run metadata row"
            tests:
              - not_null

          - name: assumption_type
            description: "Type of assumption workbook associated with the run"

          - name: dag_id
            description: "Airflow DAG id"

          - name: dag_run_id
            description: "Airflow DAG run id"

          - name: task_id
            description: "Airflow task id that registered the upload"
            
          - name: registered_at
            description: "Timestamp when the pipeline metadata row was written"
