version: 2

sources:
  - name: data
    description: A clone of a snowflake database
    database: dbt_db
    schema: dbt_schema
    tables:
      - name: policy
        description: Simulated policy data
        columns:
          - name: policy_id
            description: "policy id"
            tests:
              - unique
              - not_null

          - name: state
            description: "states of the US"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["CA","TX","FL","NY","IL","PA","OH","GA","NC","MI"]

          - name: risk_class
            description: "risk class of the car"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["preferred", "standard", "nonstandard", "commercial"]

          - name: vehicle_segment
            description: "vehicle type"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["sedan","suv","truck","sports"]

          - name: effective_date
            description: "Policy effective data"
            tests:
              - not_null
              - effective_date_valid:
                  arguments:
                    min_date: '2010-01-01'

          - name: expiration_date
            description: "Policy expiration date"
            tests:
              - not_null

          - name: status
            description: "The status of the policy"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["active", "cancelled", "expired"]

          - name: written_premium
            description: "Total premium written for the policy"
            tests:
              - not_null

          - name: term_months
            description: "Policy term in months"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [6, 12]


      - name: rate_level_history
        description: "Simulated rate level history data"
        columns:
          - name: filing_id
            description: "Filing identifier"
            tests:
              - not_null
              - unique

          - name: effective_date
            description: "Effective date of the New Rate"
            tests:
              - not_null

          - name: state
            description: "states of the US"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["CA","TX","FL","NY","IL","PA","OH","GA","NC","MI", "ALL"]

          - name: risk_class
            description: "risk class of the car"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["preferred", "standard", "nonstandard", "commercial", "ALL"]

          - name: vehicle_segment
            description: "vehicle type"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["sedan","suv","truck","sports"]

          - name: rate_change_pct
            description: "rate change percentage"
            tests:
              - not_null

          - name: cumulative_factor
            description: "Multiplicative rating factor"
            tests:
              - not_null

      - name: claim
        description: "Simulated Fact table for insurance claims"
        columns:
          - name: claim_id
            description: "Unique claim identifier"
            tests:
              - not_null
              - unique

          - name: policy_id
            description: "Foreign key to dim_policy"
            tests:
              - not_null
              - relationships:
                  arguments:
                    field: policy_id
                    to: source('data', 'policy')

          - name: loss_date
            description: "Date of loss event"
            tests:
              - not_null

          - name: transaction_date
            description: "Date of transaction event"
            tests:
              - not_null

          - name: incremental_paid
            description: "The amount of paid"
            tests:
              - not_null

          - name: cumulative_paid
            description: "The amount of total paid of this claim_id"
            tests:
              - not_null

          - name: case_reserve
            description: "Case reserve amount"
            tests:
              - not_null

          - name: incurred
            description: "Paid + Reserved"
            tests:
              - not_null

          - name: status
            description: "Current status of the claim"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["open", "closed"]
