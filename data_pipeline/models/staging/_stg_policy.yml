version: 2

models:
  - name: stg_policy
    columns:
      - name: expiration_date
        description: "Policy expiration date"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "expiration_date >= effective_date"

      - name: cancellation_date
        description: "Policy cancellation date (if any)"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "cancellation_date IS NULL OR cancellation_date >= effective_date"

      - name: written_premium
        description: "Total premium written for the policy"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "written_premium >= 0"

      - name: vehicle_year
        description: "Vehicle manufacturing year"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "vehicle_year >= 2005 AND vehicle_year <= EXTRACT(YEAR FROM CURRENT_DATE())"

      - name: driver_age
        description: "Driver age"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "driver_age >= 16 AND driver_age <= 80"

  - name: stg_claim
    description: "Simulated Fact table for insurance claims"
    columns:
      - name: loss_date
        description: "Date of loss event"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "loss_date <= CURRENT_DATE"

      - name: report_date
        description: "Date claim was reported"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "report_date >= loss_date"

      - name: close_date
        description: "Date claim was reported"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "close_date >= report_date"

      - name: reported_loss
        description: "Paid + Case reserve"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "reported_loss >= 0"

      - name: paid_loss
        description: "Total amount paid"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "paid_loss >= 0"

      - name: case_reserve
        description: "Case reserve amount"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "case_reserve >= 0"

      - name: incurred_loss
        description: "Paid + Reserved"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "incurred_loss = paid_loss + case_reserve"

  - name: stg_rate_level_history
    columns:
      - name: cumulative_factor
        description: "Multiplicative rating factor"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "cumulative_factor > 0"
