version: 2

models:
  - name: fct_actuarial_frequency_severity
    columns:
      - name: selection_version_id
        data_tests:
          - not_null
      - name: development_pool_id
        data_tests:
          - not_null
      - name: accident_period
        data_tests:
          - not_null
      - name: frequency
        data_tests:
          - not_null
      - name: severity
        data_tests:
          - not_null
      - name: pure_premium
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - selection_version_id
              - triangle_grain
              - development_pool_id
              - accident_period
