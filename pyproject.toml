[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-actuarial-platform"
version = "0.1.0"
description = "Governed multi-line actuarial modeling and approval platform"
requires-python = ">=3.10"
dependencies = [
    "chainladder>=0.10,<0.11",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
workflow = [
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "requests>=2.32,<3",
    "snowflake-connector-python[pandas]>=3.0",
    "streamlit>=1.40,<2",
    "uvicorn[standard]>=0.30,<1",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "actuarial_api*",
    "actuarial_engine*",
    "actuarial_workflow*",
    "platform_common*",
]

[tool.pytest.ini_options]
testpaths = ["actuarial_engine/tests", "actuarial_workflow/tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:overflow encountered in square:RuntimeWarning:chainladder.core.dunders",
]
